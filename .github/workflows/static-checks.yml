name: Static Checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate tracks.json
        run: python -m json.tool tracks.json
      - name: Check Python syntax
        run: python -m py_compile build_catalog.py || true
